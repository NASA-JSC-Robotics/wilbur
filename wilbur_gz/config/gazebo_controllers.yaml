controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ur_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    w200_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hande_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    velocity_controller:
      type: diff_drive_controller/DiffDriveController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_gripper_hande_controller:
      type: position_controllers/GripperActionController

ur_joint_state_broadcaster:
  ros__parameters:
    joints:
      - arm_0_shoulder_pan_joint
      - arm_0_shoulder_lift_joint
      - arm_0_elbow_joint
      - arm_0_wrist_1_joint
      - arm_0_wrist_2_joint
      - arm_0_wrist_3_joint
    interfaces:
      - position
      - velocity
      - effort

w200_joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - rear_left_wheel_joint
      - front_right_wheel_joint
      - rear_right_wheel_joint
    interfaces:
      - position
      - velocity

hande_joint_state_broadcaster:
  ros__parameters:
    joints:
      - arm_0_finger_1_joint
    interfaces:
      - position
      - velocity

velocity_controller:
  ros__parameters:
    use_sim_time: True
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint
    wheel_separation: 1.5
    wheels_per_side: 1
    wheel_radius: 0.3
    wheel_separation_multiplier: 1.125
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    publish_rate: 50.0
    odom_frame_id: 'odom'
    base_frame_id: 'base_link'
    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01
    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.001
      - 0.01
    open_loop: False
    enable_odom_tf: False
    tf_frame_prefix_enable: False
    cmd_vel_timeout: 0.25
    use_stamped_vel: False
    preserve_turning_radius: True
    publish_cmd: True
    publish_wheel_data: True
    linear.x.has_velocity_limits: True
    linear.x.has_acceleration_limits: True
    linear.x.has_jerk_limits: False
    linear.x.max_velocity: 5.0
    linear.x.min_velocity: -5.0
    linear.x.max_acceleration: 50.0
    linear.x.min_acceleration: -50.0
    linear.x.max_jerk: 0.0
    linear.x.min_jerk: 0.0
    angular.z.has_velocity_limits: True
    angular.z.has_acceleration_limits: True
    angular.z.has_jerk_limits: False
    angular.z.max_velocity: 4.0
    angular.z.min_velocity: -4.0
    angular.z.max_acceleration: 40.0
    angular.z.min_acceleration: -40.0
    angular.z.max_jerk: 0.0
    angular.z.min_jerk: 0.0

joint_trajectory_controller:
  ros__parameters:
    joints:
      - arm_0_shoulder_pan_joint
      - arm_0_shoulder_lift_joint
      - arm_0_elbow_joint
      - arm_0_wrist_1_joint
      - arm_0_wrist_2_joint
      - arm_0_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      elbow_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

robotiq_gripper_hande_controller:
  ros__parameters:
    default: true
    joint: arm_0_finger_1_joint
